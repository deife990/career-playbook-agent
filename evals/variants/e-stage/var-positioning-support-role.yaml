id: var-positioning-support-role
persona: three-year-professional
workflow: W04
turns:
- '[시뮬레이션] Gamma 합성회사 Sales Operations Associate 공고만 분석해줘. 합성 JD: pipeline reporting, cross-team coordination. 조직/도구/숫자 정보 없음. 사용자 확인 경력은 고객지원 2년, 문의 40건 응대 기록 입력뿐. 영업 지원과 리포팅 경험은 모름. 외부 웹 없음. 짧게 Candidate Strategy Brief 전체를 만들어줘.'
assertions:
  scope: Positioning, evidence mapping and summaries describe only support work and 40 recorded inquiries. They add no quality or method qualifier (customer-focused, systematic, detail-oriented, data-driven) and no unstated action or outcome as a candidate fact. Any bridge is labelled INFERENCE and not used as factual copy.
  unknown: Sales operations, reporting and coordination experience remain Unknown, not Gap or absent, in every section.
  brief: All required Candidate Strategy Brief sections are present in specified order, with no numeric fit score or invented organization facts.
