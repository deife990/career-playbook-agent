name: Build install packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m scripts.run_static_evals
      - name: Restore archived model evidence for the source version
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          version = Path('VERSION').read_text().strip()
          destination = Path('dist/evals')
          destination.mkdir(parents=True, exist_ok=True)
          for platform in ('chatgpt', 'claude'):
              shutil.copyfile(
                  Path('evals/reports') / f'{platform}-{version}.json',
                  destination / f'{platform}.json',
              )
          PY
      - name: Package only after current evidence passes readiness
        run: |
          version="$(cat VERSION)"
          scope="evals/browser-exclusion-${version}.json"
          if [ -f "$scope" ]; then
            python -m scripts.package_release --require-ready --native-exclusion "$scope"
          else
            python -m scripts.package_release --require-ready
          fi
      - run: git diff --exit-code -- adapters
      - uses: actions/upload-artifact@v4
        with:
          name: careerpilot-install-packages
          path: |
            dist/releases/careerpilot-*.zip
            dist/releases/checksums-*.sha256
          if-no-files-found: error
