name: Build install packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m scripts.run_static_evals
      - run: python -m scripts.package_release
      - run: git diff --exit-code -- adapters
      - uses: actions/upload-artifact@v4
        with:
          name: careerpilot-install-packages
          path: dist/releases/*
          if-no-files-found: error
