const layouts={
download:{title:'설치 1 / 4 · 사용할 서비스와 ZIP 고르기',side:'게임 첫 페이지',menu:['이야기','플러그인 받기','내 준비'],body:`<h2>CareerPilot 받기</h2><p>사용할 서비스 하나만 선택해요.</p><div class="row"><span class="pill">ChatGPT용</span><span class="pill">Claude용</span></div><div class="upload"><p class="file">careerpilot-claude-v1.2.0-rc.7.zip</p><span class="button">ZIP 받기</span></div><p><b>압축을 풀지 않고 보관해요.</b></p><p class="hint">다운로드는 파일을 받는 단계예요.<br>다음 단계에서 서비스의 업로드 메뉴를 사용해요.</p>`},

chatgpt:{title:'ChatGPT · ZIP 업로드 메뉴가 제공되는 계정의 예시',side:'ChatGPT · 경로도',menu:['Plugins','Personal','Installed'],body:`<div class="row"><h2>Personal · 개인용</h2><span class="pill">추가 / Add</span></div><p><span class="step">①</span> Plugins → Personal → 추가</p><div class="upload"><p><span class="step">②</span> ZIP 업로드 메뉴가 보일 때</p><p class="file">careerpilot-chatgpt-v1.2.0-rc.7.zip</p><span class="button">ZIP 파일 선택</span></div><p class="hint">개인용 업로드는 계정마다 제공 여부가 달라요.<br>공식 관리자 경로: Admin console → 워크스페이스<br>→ Plugins → Add → Upload plugin<br>웹에서도 업로드 기능이 제공되는 계정은 설치 가능해요.</p>`},

request:{title:'서안과 같이 시작하기 · 첫 요청과 짧은 답',side:'가상 사용 예시',menu:['CareerPilot','새 대화','내보내기'],body:`<p class="small">CareerPilot을 활성화한 대화 · 서안의 가상 경력</p><div class="bubble user">CareerPilot으로 이직을 준비하고 싶어.<br>먼저 내 현재 상황부터 질문 하나씩 해줘.</div><div class="bubble ai">지금 하는 일에서 가장 아쉬운 장면 하나를 말해줄래요?</div><div class="bubble user">매일 마감 문제는 혼자 처리해.<br>그런데 새 운영안을 만들어볼 기회는 줄었어.</div><p class="hint">첫 요청을 복사 → 대화에 붙이기 → 내 경험으로 답하기</p>`},
