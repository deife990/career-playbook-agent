const variants={A:['캐릭터와 눈을 마주치는 펍의 약속. 썸의 분위기와 성인 일상물의 온도를 먼저 전달해요. 현재 게임에 적용한 방향이에요.','구조 참고: 한국 연애 VN의 캐릭터 중심 배치. <a href="https://page.onstove.com/indie/global/view/11477216" target="_blank" rel="noopener">삼등분의 최애님 · 타이틀 화면 사례 ↗</a>'],B:['도시의 저녁과 물에 비친 불빛이 중심. 차분한 일상과 이직 고민에 어울리지만, 로맨스는 덜 직접적으로 보여요.','분위기 참고: <a href="https://www.4gamer.net/games/484/G048460/20200130027/" target="_blank" rel="noopener">Coffee Talk · 타이틀/메뉴 자료 ↗</a> · <a href="https://www.imdb.com/title/tt2316525/" target="_blank" rel="noopener">CLANNAD · 정적인 배경과 여백 ↗</a>'],C:['퇴근 후 발걸음이 멈춘 순간. 회사 밖으로 나가는 이야기와 두 사람의 관계를 한 장면에 담아요. 인물 표정은 작게 보여요.','우리 이야기의 게이트 CG를 활용한 독자적인 변형. 배경 중심 VN과 캐릭터 중심 연애 VN을 절충한 안이에요.']};function select(v){document.body.dataset.variant=v;document.querySelectorAll('[data-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.choice===v)));document.getElementById('idea').textContent=variants[v][0];document.getElementById('reference').innerHTML=variants[v][1];}document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>select(b.dataset.choice));select('A');
