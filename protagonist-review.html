</style></head><body><header><h1>주인공 · 같은 사람의 하루</h1><p>펍에서 나란히 앉은 장면의 왼쪽 인물이 기준이에요. 짧은 짙은 갈색 머리와 자연스러운 목덜미를 유지하고, 얼굴은 뒷모습과 화면 구도로 가려요. 밖에서는 베이지색 재킷, 실내에서는 짙은 셔츠로 이어집니다.</p><a href="./">게임으로 돌아가기 ↗</a></header><main>
<figure class="canonical"><img src="assets/seoan-close-rear-v093.png" alt="기준 원화. 왼쪽 주인공과 오른쪽 서안이 나란히 휴대폰을 본다"><figcaption><strong>기준 · 펍에서 함께 휴대폰 보기</strong>짧은 머리와 목덜미, 힘을 뺀 어깨. 얼굴이 드러나지 않는 뒷모습이에요.</figcaption></figure>
<figure class="walker"><img src="assets/protagonist-back-v0102.png" alt="같은 짧은 갈색 머리의 주인공이 베이지색 재킷을 입고 걷는 투명 원화"><figcaption><strong>퇴근길</strong>베이지색 외투 안에 짙은 셔츠. 머리 전체를 검게 칠하지 않고 자연스러운 뒷모습으로 이어가요.</figcaption></figure>
<figure><img src="assets/gate-together-v0102.png" alt="출입게이트 밖에서 같은 주인공이 서안과 마주 서 있다"><figcaption><strong>서안과 게이트 밖 대화</strong>헤어스타일·겉옷·바지·신발이 퇴근길과 이어져요.</figcaption></figure>
<figure><img src="assets/recall-service-v0102.png" alt="같은 주인공이 얼굴을 보이지 않은 채 전화 응대를 한다"><figcaption><strong>오전 · 이용권 변경 문의</strong>기준 머리와 뒷모습을 적용하고 통화와 안내 자료를 짚는 동작을 유지했어요.</figcaption></figure>
<figure><img src="assets/recall-closing-v0102.png" alt="같은 주인공의 어깨 뒤에서 보는 마감표 확인"><figcaption><strong>오후 · 마감표 확인</strong>화면 밖으로 얼굴을 가리고, 보이는 머리와 옷을 같은 기준으로 맞췄어요.</figcaption></figure>
<figure><img src="assets/home-protagonist-v0102.png" alt="집에서 외투를 벗고 휴대폰을 보는 같은 주인공"><figcaption><strong>집 · 책상 앞의 뒷모습</strong>펍에서 입었던 짙은 셔츠 차림으로 이어진다.</figcaption></figure></main></body></html>
