<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>새 타이틀 레이아웃 비교</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#fff7f0;color:#4b384b;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif}header{padding:20px 4vw 12px;display:flex;justify-content:space-between;gap:20px}h1{font-size:18px;margin:0}a{color:#8e4864;font-size:13px}nav{padding:0 4vw 16px;display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;font-size:13px;min-height:44px;padding:10px 16px;border:1px solid #bd9baa;border-radius:6px;background:#fffcf8;color:#644557;cursor:pointer}button[aria-pressed=true]{background:#ad5576;color:#fff;border-color:#ad5576}button:focus-visible,a:focus-visible{outline:3px solid #315d67;outline-offset:3px}#idea{margin:0;padding:0 4vw 18px;font-size:13px;line-height:1.6}iframe{display:block;border:0;border-top:1px solid #cdaeb9;width:100%;height:max(680px,calc(100dvh - 170px));background:#f6ddd9}footer{padding:20px 4vw;font-size:12px;line-height:1.8}@media(max-width:650px){h1{font-size:15px}header a{white-space:nowrap}nav{gap:6px}button{font-size:11px;padding:8px}#idea{font-size:12px}iframe{height:870px}}
</style></head><body><header><h1>퇴근 후, 우리 · 새 타이틀 비교</h1><a href="./">게임 열기 ↗</a></header><nav aria-label="타이틀 레이아웃 후보"><button data-choice="A" aria-pressed="true">A · 오른쪽 네 사람 — 적용안</button><button data-choice="B" aria-pressed="false">B · 왼쪽 네 사람</button><button data-choice="C" aria-pressed="false">C · 풍경을 더 넓게</button></nav><p id="idea"></p><iframe id="preview" title="선택한 타이틀의 실제 게임 미리 보기" src="./?title-layout=A"></iframe><footer>새 호숫가 배경과 네 사람의 투명 일러스트를 공통으로 사용해요. 모바일에서는 인물 위·메뉴 아래 배치로 통일해요.<br>미리 보기의 메뉴는 실제로 작동해요. <a href="TITLE_SCREEN_RESEARCH_V010.md">사례 조사와 제작 기록 ↗</a> · <a href="title-candidates-v09.html">이전 비교안 ↗</a></footer><script>
const notes={A:'서안이 앞에 서고 네 사람은 오른쪽에, 제목과 메뉴는 왼쪽에. 얼굴과 메뉴가 분리되는 기본안이에요.',B:'인물을 왼쪽에 두고 메뉴를 오른쪽에 놓았어요. 첨부한 레퍼런스와 같은 방향이며, 인물은 좌우 반전하지 않았어요.',C:'네 사람을 조금 낮추고 제목과 풍경의 여백을 넓혔어요. 차분한 온호시의 저녁이 조금 더 보여요.'};
function select(v){document.body.dataset.variant=v;document.querySelectorAll('[data-choice]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.choice===v)));document.getElementById('idea').textContent=notes[v];document.getElementById('preview').src='./?title-layout='+v;}document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>select(el.dataset.choice));document.getElementById('idea').textContent=notes.A;
</script></body></html>
