<h1>서안 · 퇴근 후의 가벼운 모습</h1>
<p>외투는 벗고, 얇은 아이보리 니트 차림으로. 어깨의 힘을 빼고 목선과 팔의 실루엣을 부드럽게 정리했어요. 같은 얼굴과 조명을 기준으로 이어지는 장면도 맞췄어요.</p>
<section class="grid">
<figure><img src="../../assets/seoan-pub-seated-v092.png" alt="외투 없이 아이보리 니트를 입고, 편안하게 잔을 잡은 서안"><figcaption><strong>기본 · 잔을 잡고 마주 보기</strong><span>첫 화면과 펍의 기본 대화에 사용해요.</span></figcaption></figure>
<figure><img src="../../assets/seoan-pub-chin-v091.png" alt="한 손으로 턱을 가볍게 괴고 고민하는 서안"><figcaption><strong>고민 · 턱을 가볍게 괴기</strong><span>회사와 앞으로의 일을 고민하는 대화에 사용해요.</span></figcaption></figure>
<figure><img src="../../assets/seoan-pub-laugh-v092.png" alt="잔을 잡고 편하게 웃는 서안"><figcaption><strong>웃음 · 잠깐 풀리는 긴장</strong><span>농담과 약속을 나누는 순간에 사용해요.</span></figcaption></figure>
<figure><img src="../../assets/seoan-badge-off-v091.png" alt="니트 차림으로 목에 걸린 출입증을 벗는 서안"><figcaption><strong>퇴근 · 출입증 벗기</strong><span>본격적인 대화 전에 회사에서의 하루를 내려놓아요.</span></figcaption></figure>
<figure><img src="../../assets/seoan-close-rear-v093.png" alt="두 사람의 뒤에서, 의자를 가까이 붙인 서안과 익명의 주인공이 휴대폰을 함께 보는 모습"><figcaption><strong>가까이 · 두 사람의 뒷모습</strong><span>카메라를 뒤로 옮겼어요. 의자를 붙여 앉은 두 사람이 어깨를 살짝 맞댄 채 같은 화면을 봐요.</span></figcaption></figure>
